name: apps

# The apps, each built and then tried out:
# - Android (android/): the APK for phones (arm64-v8a) and one for an emulator (x86_64), which installs it
#   and checks that the app answers;
# - Windows (windows/): JobRadar.exe with Python inside (PyInstaller) in an installer (Inno Setup), which
#   is installed silently and checked the same way.
# They are in the run's artifacts. A v tag (git tag v1.2.0, git push origin v1.2.0) also publishes them
# as a GitHub release, with the one-line installers for Windows, macOS and Linux.
on:
  push:
    branches: ["**"]
    tags: ["v*"]  # tags ignore the paths below
    # the apps carry jobradar/ and its requirements
    paths: ["android/**", "windows/**", "jobradar/**", "config.example.yaml", "requirements.txt", ".github/workflows/apps.yml"]
  workflow_dispatch:

permissions:
  contents: read  # only the release job writes (its own permissions, below)

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, x86_64]
    env:
      # with the signing key in the repository's secrets: a release APK, always the same signature, so
      # a new version installs over the last one; without it (a fork): a debug APK, a new key each build
      SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      # Android compares versions by number (p4a: "10" + min API + the digits), so each must be newer:
      # a v1.2.3 tag gives 1.2.3; other builds 0.1.<run>, lower than any release
      - name: The app's version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="0.1.$GITHUB_RUN_NUMBER"; fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: The signing key, from the repository's secrets
        if: env.SIGNED == 'true'
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/jobradar.keystore"
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # the Android SDK and NDK (only downloads): saved even when a build fails
      - uses: actions/cache/restore@v4
        with:
          path: ~/.buildozer
          key: android-sdk-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: android-sdk-${{ matrix.arch }}-
      # what was already compiled (Python, OpenSSL, pydantic-core): saved only after a build that worked,
      # because a build that stops halfway can leave it broken
      - uses: actions/cache@v4
        with:
          path: android/.buildozer
          key: p4a-${{ matrix.arch }}-${{ hashFiles('android/buildozer.spec') }}-${{ github.run_id }}
          # after a change to buildozer.spec, start from the last good build: python-for-android only
          # rebuilds what changed
          restore-keys: |
            p4a-${{ matrix.arch }}-${{ hashFiles('android/buildozer.spec') }}-
            p4a-${{ matrix.arch }}-
      # python-for-android makes a venv for its pip installs and doesn't expect one to be there already:
      # making it over the cached one puts the bundled pip back over the upgraded one, half-mixed
      - run: rm -rf android/.buildozer/android/platform/build-*/build/venv
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev cmake zip unzip
      # buildozer brings the Cython it needs (<3.0); python-for-android builds its own tools for the APK
      - run: pip install buildozer==1.6.0 2>&1 | tee android/build.log
        shell: bash
      # the same jobradar package as on the computer, next to android/main.py
      - run: cp -r jobradar config.example.yaml android/
      - run: buildozer android ${{ env.SIGNED == 'true' && 'release' || 'debug' }} 2>&1 | tee build.log
        shell: bash
        working-directory: android
        env:
          APP_ANDROID_ARCHS: ${{ matrix.arch }}  # overrides android.archs in buildozer.spec
          # read by Gradle while it signs, from the environment: nothing is written into the cached build
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/jobradar.keystore
          P4A_RELEASE_KEYALIAS: jobradar
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: The APK is signed with the JobRadar key
        if: env.SIGNED == 'true'
        run: |
          apksigner=$(ls ~/.buildozer/android/platform/android-sdk/build-tools/*/apksigner | tail -1)
          signer=$("$apksigner" verify --print-certs android/bin/*.apk | grep "SHA-256 digest")
          echo "$signer"
          # the key's certificate (public): keytool -list -v on chave-android/jobradar-release.keystore
          echo "$signer" | grep -q e4331b3a7533313f2d9cdddf46a5959c0c268063addc29c8dcf9291b52eed22c
      - name: Put the end of the build log in annotations
        if: failure()
        run: |
          for venv in android/.buildozer/android/platform/build-*/build/venv; do
            [ -d "$venv" ] && echo "$venv: $(ls "$venv"/lib/python3*/site-packages | grep -i '^pip')" >> android/build.log
          done
          bash android/annotate.sh android/build.log "buildozer ${{ matrix.arch }}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.buildozer
          key: android-sdk-${{ matrix.arch }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: jobradar-apk-${{ matrix.arch }}
          path: android/bin/*.apk

  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jobradar-apk-x86_64
          path: android/bin
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # a third party's action: pinned to a commit, which a moved tag can't change
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash android/smoke.sh
      - name: Put the test's output in annotations
        if: failure()
        run: bash android/annotate.sh smoke.log smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator
          path: |
            smoke.log
            screen.png
            logcat.txt

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The app's version (as for Android)
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="0.1.$GITHUB_RUN_NUMBER"; fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      # uvicorn picks its parts by name at run time, so PyInstaller doesn't see them on its own
      - name: JobRadar.exe, with Python inside
        run: >-
          pyinstaller --noconfirm --windowed --name JobRadar --icon jobradar/static/icon.ico --paths .
          --collect-data jobradar --collect-submodules uvicorn --add-data "config.example.yaml;." windows/start.py
      - name: The installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVersion=$env:APP_VERSION" windows\JobRadar.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install it silently, open it and check that it answers
        run: |
          $setup = (Get-ChildItem dist\JobRadar-*-windows-setup.exe).FullName
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=", "/LOG=setup.log" -Wait
          Start-Process "$env:LOCALAPPDATA\Programs\JobRadar\JobRadar.exe" -ArgumentList "--no-browser", "--port", "8124"
          foreach ($i in 1..60) {
            try { $jobs = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8124/api/jobs).Content; break } catch { Start-Sleep 1 }
          }
          if ($jobs -ne "[]") { throw "the installed JobRadar.exe didn't answer" }
          if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8124/).Content -notmatch "<title>JobRadar") { throw "no page" }
          Get-ChildItem "$env:LOCALAPPDATA\JobRadar" | Select-Object Name  # its data folder: config.yaml, jobradar.db
      - name: What the installer left, and the app's log, in an annotation
        if: failure()
        run: |
          $lines = @(
            "installed: " + ((Get-ChildItem "$env:LOCALAPPDATA\Programs\JobRadar" -ErrorAction SilentlyContinue).Name -join ", "),
            "data: " + ((Get-ChildItem "$env:LOCALAPPDATA\JobRadar" -ErrorAction SilentlyContinue).Name -join ", "),
            "running: " + ((Get-Process JobRadar -ErrorAction SilentlyContinue).Id -join ", "),
            "--- jobradar.log:") + (Get-Content "$env:LOCALAPPDATA\JobRadar\jobradar.log" -Tail 30 -ErrorAction SilentlyContinue) +
            @("--- setup.log:") + (Get-Content setup.log -Tail 25 -ErrorAction SilentlyContinue)
          $text = ($lines -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
          Write-Output "::error title=windows::$text"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: jobradar-windows-setup
          path: dist/JobRadar-*-windows-setup.exe

  release:
    # only for a v tag, and only once the APK passed the emulator and the installer installed and ran
    if: github.ref_type == 'tag'
    needs: [emulator, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jobradar-apk-arm64-v8a
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: jobradar-windows-setup
          path: setup
      - name: The release, with the phone's APK, the Windows installer and the one-line installers
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp apk/*.apk "JobRadar-$version-android.apk"
          gh release create "$GITHUB_REF_NAME" "JobRadar-$version-android.apk" setup/*.exe install.ps1 install.sh \
            --title "JobRadar $version" --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
