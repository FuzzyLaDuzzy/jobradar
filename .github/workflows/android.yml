name: android

# The Android app (android/): builds the APK for phones (arm64-v8a) and one for the emulator (x86_64),
# then opens that one on an emulator and checks that the app answers. The APKs are in the run's
# artifacts (jobradar-apk-arm64-v8a is the one for a phone).
on:
  push:
    paths: ["android/**", "jobradar/**", "config.example.yaml", ".github/workflows/android.yml"]  # the APK carries jobradar/
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, x86_64]
    env:
      # with the signing key in the repository's secrets: a release APK, always the same signature, so
      # a new version installs over the last one; without it (a fork): a debug APK, a new key each build
      SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: The signing key, from the repository's secrets
        if: env.SIGNED == 'true'
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/jobradar.keystore"
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # the Android SDK and NDK (only downloads): saved even when a build fails
      - uses: actions/cache/restore@v4
        with:
          path: ~/.buildozer
          key: android-sdk-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: android-sdk-${{ matrix.arch }}-
      # what was already compiled (Python, OpenSSL, pydantic-core): saved only after a build that worked,
      # because a build that stops halfway can leave it broken
      - uses: actions/cache@v4
        with:
          path: android/.buildozer
          key: p4a-${{ matrix.arch }}-${{ hashFiles('android/buildozer.spec') }}-${{ github.run_id }}
          # after a change to buildozer.spec, start from the last good build: python-for-android only
          # rebuilds what changed
          restore-keys: |
            p4a-${{ matrix.arch }}-${{ hashFiles('android/buildozer.spec') }}-
            p4a-${{ matrix.arch }}-
      # python-for-android makes a venv for its pip installs and doesn't expect one to be there already:
      # making it over the cached one puts the bundled pip back over the upgraded one, half-mixed
      - run: rm -rf android/.buildozer/android/platform/build-*/build/venv
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev cmake zip unzip
      # buildozer brings the Cython it needs (<3.0); python-for-android builds its own tools for the APK
      - run: pip install buildozer==1.6.0 2>&1 | tee android/build.log
        shell: bash
      # the same jobradar package as on the computer, next to android/main.py
      - run: cp -r jobradar config.example.yaml android/
      - run: buildozer android ${{ env.SIGNED == 'true' && 'release' || 'debug' }} 2>&1 | tee build.log
        shell: bash
        working-directory: android
        env:
          APP_ANDROID_ARCHS: ${{ matrix.arch }}  # overrides android.archs in buildozer.spec
          APP_VERSION: 0.1.${{ github.run_number }}  # each build a newer version: it installs as an update
          # read by Gradle while it signs, from the environment: nothing is written into the cached build
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/jobradar.keystore
          P4A_RELEASE_KEYALIAS: jobradar
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: The APK is signed with the JobRadar key
        if: env.SIGNED == 'true'
        run: |
          apksigner=$(ls ~/.buildozer/android/platform/android-sdk/build-tools/*/apksigner | tail -1)
          signer=$("$apksigner" verify --print-certs android/bin/*.apk | grep "SHA-256 digest")
          echo "$signer"
          # the key's certificate (public): keytool -list -v on chave-android/jobradar-release.keystore
          echo "$signer" | grep -q e4331b3a7533313f2d9cdddf46a5959c0c268063addc29c8dcf9291b52eed22c
      - name: Put the end of the build log in annotations
        if: failure()
        run: |
          for venv in android/.buildozer/android/platform/build-*/build/venv; do
            [ -d "$venv" ] && echo "$venv: $(ls "$venv"/lib/python3*/site-packages | grep -i '^pip')" >> android/build.log
          done
          bash android/annotate.sh android/build.log "buildozer ${{ matrix.arch }}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.buildozer
          key: android-sdk-${{ matrix.arch }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: jobradar-apk-${{ matrix.arch }}
          path: android/bin/*.apk

  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jobradar-apk-x86_64
          path: android/bin
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash android/smoke.sh
      - name: Put the test's output in annotations
        if: failure()
        run: bash android/annotate.sh smoke.log smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator
          path: |
            smoke.log
            screen.png
            logcat.txt
