name: android

# The Android app (android/): builds the APK, then opens it on an emulator and checks that the app answers.
# The APK is in the run's artifacts (jobradar-apk).
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # the Android SDK and NDK (only downloads): saved even when a build fails
      - uses: actions/cache/restore@v4
        with:
          path: ~/.buildozer
          key: android-sdk-${{ github.run_id }}
          restore-keys: android-sdk-
      # what was already compiled (Python, OpenSSL, pydantic-core): saved only after a build that worked,
      # because a build that stops halfway can leave it broken (it did: half an upgraded pip)
      - uses: actions/cache@v4
        with:
          path: android/.buildozer
          key: p4a-${{ hashFiles('android/buildozer.spec') }}-${{ github.run_id }}
          restore-keys: p4a-${{ hashFiles('android/buildozer.spec') }}-
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev cmake zip unzip
      # buildozer brings the Cython it needs (<3.0); python-for-android builds its own tools for the APK
      - run: pip install buildozer==1.6.0 2>&1 | tee android/build.log
        shell: bash
      # the same jobradar package as on the computer, next to android/main.py
      - run: cp -r jobradar config.example.yaml android/
      - run: buildozer android debug 2>&1 | tee build.log
        shell: bash
        working-directory: android
        env:
          # python-for-android upgrades pip in its build venv to the newest; pip 26.3 (2 Nov 2026) is
          # newer than that python-for-android release. ponytail: drop once a build passes without it
          PIP_CONSTRAINT: ${{ github.workspace }}/android/pip-constraints.txt
      - name: Put the end of the build log in annotations
        if: failure()
        run: |
          for venv in android/.buildozer/android/platform/build-*/build/venv; do
            [ -d "$venv" ] && echo "$venv: $(ls "$venv"/lib/python3*/site-packages | grep -i '^pip')" >> android/build.log
          done
          bash android/annotate.sh android/build.log buildozer
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.buildozer
          key: android-sdk-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: jobradar-apk
          path: android/bin/*.apk

  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jobradar-apk
          path: android/bin
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash android/smoke.sh
      - name: Put Python's output in annotations
        if: failure()
        run: grep -E " python *:" logcat.txt > python.txt; bash android/annotate.sh python.txt logcat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator
          path: |
            screen.png
            logcat.txt
